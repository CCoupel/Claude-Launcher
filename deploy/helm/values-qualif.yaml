# QUALIF du launcher du cluster (décision utilisateur 2026-11-17) : namespace claude-qualif, racine DÉDIÉE
# /share/MFS/ROOT/CLAUDE-QUALIF (même MooseFS, jamais la racine de PROD), avec son propre
# .config/claude-launcher-ng2/backends.yaml (mêmes types de backends que la PROD, k8s → claude-qualif).
# Release « claude-launcher-qualif ». Valeurs non secrètes uniquement ; un certificat fourni reste dans PRIVATE/QUALIF/.
#   KUBECONFIG=PRIVATE/QUALIF/ng2-deploy.kubeconfig \
#   helm upgrade --install claude-launcher-qualif deploy/helm/claude-launcher -n claude-qualif \
#     -f deploy/helm/values-qualif.yaml -f PRIVATE/QUALIF/values-local.yaml --set image.tag=vX.Y.Z.a
#   (PRIVATE/QUALIF/values-local.yaml : ingress.tls.clusterIssuer réel, jamais commité — voir deploy.qualif.md)

# image candidate : registre interne sur srv1-docker (décision D2, jamais ghcr) ; tag donné à l'installation.
# Risque accepté (H2) : image désignée par tag, sans digest (réseau interne de confiance).
image:
  repository: 192.168.1.211:5000/claude-launcher
  pullPolicy: IfNotPresent

# nom propre à la QUALIF : jamais celui de la PROD (« cluster ») ni celui d'un poste
hubName: cluster-qualif

# racine de QUALIF : son PVC ne monte QUE ce dossier (la racine de PROD n'est pas visible du pod)
rootBase: /share/MFS/ROOT/CLAUDE-QUALIF
volume:
  existingClaim: claude-projects-qualif   # PVC RWX du namespace claude-qualif, CRÉÉ PAR LE CHART (conservé à la désinstallation)
  mountPath: /share/MFS/ROOT/CLAUDE-QUALIF
  create:
    enabled: true
    storage: 100Gi
    storageClassName: ""                  # liaison statique (aucune StorageClass ne vise un dossier MooseFS choisi)
    persistentVolume:
      # PV statique vers /share/MFS/ROOT/CLAUDE-QUALIF : objet du CLUSTER, créé par l'administrateur (fiche) ;
      # le chart crée le PVC et le lie à ce PV. Variante : enabled: true + source (dans PRIVATE/QUALIF/values-local.yaml),
      # le chart crée aussi le PV — exige un compte avec droits cluster sur les PersistentVolumes au déploiement.
      enabled: false
      name: claude-qualif-pv

ingress:
  enabled: true
  controller: traefik
  className: traefik
  host: launcher-qualif.coupel.lan        # à déclarer dans le DNS interne (vers le contrôleur Traefik)
  allowedSourceRanges: ["192.168.1.0/24"]
  tls:
    # ClusterIssuer interne : nom NON relu (le compte ng2-tests ne peut pas lister les clusterissuers).
    # À RENSEIGNER avant l'installation : kubectl get clusterissuer (compte admin ou ng2-deploy) ;
    # le chart refuse « a-renseigner ».
    clusterIssuer: a-renseigner
