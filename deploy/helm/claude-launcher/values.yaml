# Valeurs du chart du launcher du cluster — contrat : contracts/helm-values.md.
# Les valeurs marquées OBLIGATOIRE n'ont pas de défaut : leur absence fait échouer helm install / template
# avec un message qui les nomme (values.schema.json).

image:
  repository: ghcr.io/ccoupel/claude-launcher
  tag: ""                 # défaut : appVersion du chart ; mise à jour du launcher = changer ce tag
  digest: ""              # sha256:… facultatif : image installée par empreinte (dépôt:tag@empreinte)
  pullPolicy: IfNotPresent

imagePullSecrets: []      # ex. [{name: regcred}] pour un registre privé
nodeSelector: {}          # nœud imposé (image importée sur certains nœuds seulement, pullPolicy Never)

hubName: ""               # CL_HUB_NAME ; défaut : nom de la release ; unique parmi les launchers de la racine

rootBase: ""              # OBLIGATOIRE — CL_ROOT_BASE, chemin absolu, = volume.mountPath ou un sous-dossier

volume:
  existingClaim: ""       # OBLIGATOIRE — nom du PVC RWX monté (existant, ou créé par le chart si create.enabled)
  mountPath: ""           # défaut : rootBase
  # création du volume par le chart (défaut : non, le PVC existe déjà). PVC (et PV) créés avec
  # helm.sh/resource-policy: keep → jamais supprimés par helm uninstall (les fichiers des projets y sont).
  create:
    enabled: false
    storage: 100Gi
    storageClassName: ""  # "" = liaison au PV statique ci-dessous ; une StorageClass RWX crée un dossier neuf, pas rootBase
    persistentVolume:     # PV statique vers le dossier rootBase — objet du CLUSTER : droits d'administrateur au déploiement
      enabled: false
      name: ""            # OBLIGATOIRE en liaison statique : PV auquel le PVC est lié (volumeName) — PV de l'administrateur
                          # (enabled: false) ou créé par le chart (enabled: true) ; interdit avec une storageClassName
      source: {}          # OBLIGATOIRE si PV : source du volume (csi / nfs / hostPath…) recopiée du PV de PROD, chemin = rootBase

runAsUser: 1000           # propriétaire des fichiers du partage ; fsGroup jamais posé
runAsGroup: 1000

allowHostBackend: false   # CL_ALLOW_HOST_BACKEND

# accès à l'interface web quand auth.enabled est faux : none (défaut) = sans jeton, l'Ingress (liste d'adresses + TLS) est la
# seule barrière ; token = URL d'amorçage avec jeton (comme le launcher local). Devient CL_WEB_ACCESS dans le pod.
# Avec auth.enabled: true (défaut v7.0.0), le mode est imposé à « proxy » : laisser vide (poser une valeur est refusé).
web: {}                 # access: none | token (sans auth.enabled) ; ne pas poser avec auth.enabled

service:
  port: 8080              # Service ClusterIP uniquement (type non réglable)

ingress:
  enabled: true
  controller: ""          # OBLIGATOIRE si Ingress — traefik | nginx
  className: ""           # OBLIGATOIRE si Ingress — ingressClassName
  host: ""                # OBLIGATOIRE si Ingress — nom DNS interne ; CL_WEB_URL=https://<host>
  allowedSourceRanges: [] # OBLIGATOIRE si Ingress, non vide — CIDR admis ; 0.0.0.0/0 et ::/0 refusés
  tls:                    # OBLIGATOIRE si Ingress — l'un des deux
    secretName: ""        # Secret TLS fourni (créé à part ; jamais dans les valeurs)
    clusterIssuer: ""     # émetteur cert-manager ; Secret <release>-tls
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# coffre des secrets (#201) : commun au hub, à l'exe Windows et au pod, sous <rootBase>/.config/claude-launcher-ng2/secrets
# (aucun volume dédié). secrets.legacy : ancien coffre v6.4.0 (PVC <release>-secrets, conservé), monté en lecture
# seule s'il existe, pour la migration automatique (CL_SECRETS_LEGACY_DIR). runAsUser doit posséder le partage.
secrets:
  legacy:
    enabled: true

# NetworkPolicy (#200, défaut : activée) : entrée du pod seulement depuis le namespace du contrôleur d'Ingress ;
# sondes du kubelet admises par le CNI ; sortie non restreinte. Traefik en réseau d'hôte : ingressCIDRs = adresses des nœuds.
networkPolicy:
  enabled: true
  ingressNamespaces: [traefik]
  ingressPodSelector:     # labels des pods du contrôleur (Traefik RKE2 du cluster) ; ET avec le namespace ; retirer une clé : la mettre à null
    app.kubernetes.io/name: traefik
  ingressCIDRs: []

# v7.0.0 — accès authentifié (#172, contracts/auth.md, contracts/helm-values.md « Valeurs auth.* ») : sidecar oauth2-proxy
# devant le launcher (qui n'écoute plus que sur la boucle locale du pod). auth.enabled: false = comportement de v6.9.0.
auth:
  enabled: true
  github:
    enabled: true           # connexion GitHub ; false permis seulement avec localAdmin.enabled (QUALIF avant les applications GitHub, secours)
    # Alternative à existingSecret : le chart crée le Secret <release>-github (client-id, client-secret). ATTENTION : la valeur de
    # clientSecret est lisible par « helm get values » et « helm template », et stockée dans le Secret de release Helm — réservé à
    # PRIVATE/<ENV>/values-local.yaml, JAMAIS dans un fichier suivi par git (scripts/ci.sh le contrôle). existingSecret reste recommandé.
    clientId: ""
    clientSecret: ""
  existingSecret: ""        # Secret du namespace, clés client-id et client-secret (GitHub App) — RECOMMANDÉ ; jamais la valeur ici.
                            # OBLIGATOIRE si github.enabled, sauf si github.clientId / github.clientSecret sont donnés (exclusifs)
  admins: []                # OBLIGATOIRE non vide si github.enabled, SAUF si localAdmin.enabled (admin@local, hôte interne seulement : les actions R1 se font alors depuis l'hôte interne) — logins GitHub, rôle admin (écritures sensibles R1 permises) ;
                            # copier le login TEL QU'AFFICHÉ par GitHub (casse comprise : oauth2-proxy la respecte)
  users: []                 # logins GitHub (casse de GitHub, comme admins), rôle user (terminaux et projets, pas d'écriture R1)
  localAdmin:               # compte local de secours admin@local (htpasswd d'oauth2-proxy), jamais sur l'hôte externe
    enabled: true
    existingSecret: ""      # Secret fourni (clé htpasswd : admin@local:$2y$<coût ≥ 10>$…) ; vide : Secret <release>-local-admin généré
    hosts: []               # hôtes où le compte local est admis ; défaut : [ingress.host] ; l'hôte externe y est refusé
  sessionDuration: 8h       # --cookie-expire (15m à 168h)
  sessionRefresh: 1h        # --cookie-refresh (inférieur à la durée)
  proxy:
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.15.6          # jamais latest
      digest: ""            # sha256:… facultatif (empreinte de l'image) ; fixée dans values-qualif.yaml et values-prod.yaml
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  rateLimit:                # Traefik : essais par minute et par adresse source sur /oauth2/ (nginx : limit-rpm)
    average: 10
    burst: 20

# Avec pathPrefix, l'hôte est déjà servi par d'autres applications : le chart ne crée aucun Certificat (ni annotation cert-manager) ;
# tls.clusterIssuer est REFUSÉ au rendu ; donner tls.secretName (certificat existant du namespace) ou rien (certificat de l'hôte
# choisi par SNI).
# Ingress externe (v7.0.0, #254) : exige auth.enabled ; cible l'instance auth-proxy-ext (sans compte local)
externalIngress:
  enabled: false
  className: ""
  host: ""                # nom d'hôte RFC 1123 en minuscules (sans schéma ni chemin)
  sessionDuration: 4h     # session de l'instance externe (--cookie-expire) : plus courte que l'interne (8h) — exposition Internet, 15m à 168h
  pathPrefix: ""          # sous-chemin public (ex. /claude-qualif) : Ingress sur ce seul préfixe, jamais retiré ; vide : racine de l'hôte
  tls:
    clusterIssuer: ""     # ex. letsencrypt-prod
    secretName: ""
  annotations: {}

rbac:
  extraNamespaces: []     # #193 : même Role + RoleBinding (ServiceAccount du pod) dans chaque namespace listé ; aucun ClusterRole

backends:
  kubeconfigs: []         # #193 : [{name, secretName, key}] → /var/run/claude-launcher/kube/<name>/config (lecture seule, 0444)
  docker:
    secretName: ""        # Secret TLS docker/podman facultatif (ca.pem, cert.pem, key.pem), monté en lecture seule
                          # dans /var/run/claude-launcher/docker (docker :2375 sans TLS accepté en v6.4.0)

extraEnv: []              # [{name: X, value: y}]

terminationGracePeriodSeconds: 30

# Espaces et backends des utilisateurs (v7.1.0, contracts/user-backends.md, helm-values.md « users.* »)
users:
  enabled: true             # espaces par utilisateur (users/<uid>/ sous la config de la racine) ; false : comportement v7.0.0 (CL_USERS_ENABLED=false, lu par le launcher : un seul espace commun, règles R1 inchangées)
  maxBackends: 10           # backends par utilisateur (1 à 100) ; au-delà, refus à l'enregistrement
  backendTestsPerMinute: 6  # backendTest par utilisateur et par minute (1 à 60), un seul à la fois (429)
