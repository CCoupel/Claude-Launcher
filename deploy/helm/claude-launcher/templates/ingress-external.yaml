{{- /* Ingress externe PRÉPARÉ (#172, v7.0.0) : jamais rendu en v6.4.0 — cl.validate refuse externalIngress.enabled tant que
l'authentification n'existe pas. Aucune liste d'adresses : l'authentification serait la seule barrière. */ -}}
{{- if .Values.externalIngress.enabled }}
{{- $name := printf "%s-external" (include "cl.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.externalIngress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.externalIngress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.externalIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.externalIngress.className }}
  tls:
    - hosts: [{{ .Values.externalIngress.host | quote }}]
      secretName: {{ default (printf "%s-tls" $name) .Values.externalIngress.tls.secretName }}
  rules:
    - host: {{ .Values.externalIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cl.fullname" . }}
                port:
                  name: http
{{- end }}
