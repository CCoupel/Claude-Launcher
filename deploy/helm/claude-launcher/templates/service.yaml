# ClusterIP seul : l'accès passe par l'Ingress interne (liste d'adresses + TLS) ; type non réglable
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cl.fullname" . }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cl.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.externalIngress.enabled }}
    # instance auth-proxy-ext (sans compte local) : seule cible de l'Ingress externe (#254)
    - name: http-ext
      port: 8083
      targetPort: http-ext
      protocol: TCP
    {{- end }}
