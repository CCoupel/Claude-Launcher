{{- /* Secret du cookie d'oauth2-proxy (v7.0.0, contracts/helm-values.md) : généré à la première installation (32 caractères),
conservé ensuite (lookup + keep) pour ne pas déconnecter tout le monde à chaque helm upgrade ; jamais dans les valeurs. */ -}}
{{- if .Values.auth.enabled }}
{{- $name := include "cl.cookieSecretName" . }}
{{- $cur := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $cur (index $cur.data "cookie-secret") }}
  cookie-secret: {{ index $cur.data "cookie-secret" }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
