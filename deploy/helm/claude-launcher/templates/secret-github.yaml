{{- /* Secret de la GitHub App créé par le chart (auth.github.clientId / clientSecret) — alternative à auth.existingSecret, jamais
recommandée : la valeur est visible par helm get values / helm template et stockée dans le Secret de release. Rendu seulement si
l'authentification et GitHub sont activés ET que la paire est donnée (cl.validate refuse tout mélange). */ -}}
{{- if and .Values.auth.enabled .Values.auth.github.enabled .Values.auth.github.clientId .Values.auth.github.clientSecret (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cl.githubSecretName" . }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ .Values.auth.github.clientId | b64enc }}
  client-secret: {{ .Values.auth.github.clientSecret | b64enc }}
{{- end }}
