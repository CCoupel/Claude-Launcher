# coffre des secrets du launcher (#194) : volume RWO propre au pod, hors de la racine partagée ;
# conservé à la désinstallation (les clés ssh et kubeconfigs déposés y sont)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cl.fullname" . }}-secrets
  labels:
    {{- include "cl.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.secrets.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.secrets.persistence.size }}
