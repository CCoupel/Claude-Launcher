{{- $legacy := include "cl.legacySecrets" . -}}
{{- $root := .Values.rootBase -}}
{{- $hub := include "cl.hubName" . -}}
{{- $mount := include "cl.mountPath" . -}}
{{- $auth := .Values.auth.enabled -}}
{{- $a := .Values.auth -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cl.fullname" . }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
spec:
  # toujours 1 : un seul launcher par nom de hub (garde de présence CL_HUB_NAME)
  replicas: 1
  serviceName: {{ include "cl.fullname" . }}
  # mise à jour : le StatefulSet supprime l'ancien pod et attend sa fin AVANT de créer le nouveau
  # (jamais deux pods du même hub en même temps, contrairement au RollingUpdate d'un Deployment)
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "cl.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cl.selector" . | nindent 8 }}
        app.kubernetes.io/version: {{ include "cl.versionLabel" . | quote }}
      {{- if $auth }}
      annotations:
        # le pod redémarre quand ces objets (rendus par le chart) changent : un sidecar lit son Secret et ses gabarits au démarrage
        checksum/auth-templates: {{ include (print $.Template.BasePath "/configmap-auth-templates.yaml") . | sha256sum | quote }}
        {{- if and $a.github.enabled $a.github.clientId (not $a.existingSecret) }}
        checksum/github-secret: {{ printf "%s:%s" $a.github.clientId $a.github.clientSecret | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cl.fullname" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
        # fsGroup jamais posé : pas de changement de propriétaire récursif du partage
      containers:
        - name: launcher
          image: {{ include "cl.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # écritures : /home/launcher et /tmp (emptyDir), la racine partagée (PVC) — rien d'autre
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            {{- if $auth }}
            # derrière le proxy d'authentification : le launcher n'écoute que sur 127.0.0.1:8081 ; seul port exposé = sondes
            - name: health
              containerPort: 8082
              protocol: TCP
            {{- else }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
          env:
            - name: CL_ROOT_BASE
              value: {{ $root | quote }}
            - name: CL_HUB_NAME
              value: {{ $hub | quote }}
            - name: CL_CACHE_DIR
              value: {{ printf "%s/.cache/claude-launcher-ng2/%s" $root $hub | quote }}
            - name: CL_K8S_VOLUMES
              value: {{ printf "%s=%s" $mount .Values.volume.existingClaim | quote }}
            - name: CL_IN_CLUSTER
              value: "1"
            - name: CL_UPDATE_MODE
              value: notify
            # interface web : none = sans jeton (Ingress = seule barrière), token = URL d'amorçage avec jeton
            - name: CL_WEB_ACCESS
              value: {{ if $auth }}proxy{{ else }}{{ .Values.web.access | default "none" }}{{ end }}
            {{- if $auth }}
            # accès authentifié (contracts/auth.md §7) : boucle locale, port de santé séparé, listes de logins
            - name: CL_WEB_ADDR
              value: "127.0.0.1:8081"
            - name: CL_HEALTH_ADDR
              value: "0.0.0.0:8082"
            - name: CL_AUTH_ADMINS
              value: {{ join "," ($a.admins | default list) | lower | quote }}
            - name: CL_AUTH_USERS
              value: {{ join "," ($a.users | default list) | lower | quote }}
            - name: CL_AUTH_SESSION_DURATION
              value: {{ $a.sessionDuration | quote }}
            - name: CL_AUTH_SESSION_REFRESH
              value: {{ $a.sessionRefresh | quote }}
            - name: CL_AUTH_LOCAL_ADMIN_HOSTS
              value: {{ include "cl.localHosts" . | quote }}
            {{- end }}
            {{- if include "cl.primaryURL" . }}
            - name: CL_WEB_URL
              value: {{ include "cl.primaryURL" . | quote }}
            {{- end }}
            {{- if and .Values.externalIngress.enabled .Values.ingress.enabled }}
            - name: CL_WEB_ALT_URLS
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            {{- end }}
            {{- if .Values.allowHostBackend }}
            - name: CL_ALLOW_HOST_BACKEND
              value: "1"
            {{- end }}
            {{- if $legacy }}
            - name: CL_SECRETS_LEGACY_DIR
              value: /var/lib/claude-launcher/secrets-legacy
            {{- end }}
            {{- if .Values.backends.docker.secretName }}
            - name: DOCKER_CERT_PATH
              value: /var/run/claude-launcher/docker
            - name: DOCKER_TLS_VERIFY
              value: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: projets
              mountPath: {{ $mount }}
            - name: home
              mountPath: /home/launcher
            - name: tmp
              mountPath: /tmp
            {{- if $legacy }}
            - name: secrets-legacy
              mountPath: /var/lib/claude-launcher/secrets-legacy
              readOnly: true
            {{- end }}
            {{- range .Values.backends.kubeconfigs }}
            - name: kube-{{ .name }}
              mountPath: /var/run/claude-launcher/kube/{{ .name }}
              readOnly: true
            {{- end }}
            {{- if .Values.backends.docker.secretName }}
            - name: docker-tls
              mountPath: /var/run/claude-launcher/docker
              readOnly: true
            {{- end }}
          # démarrage (lecture de la racine sur MooseFS) : jusqu'à 2 min avant que la sonde de vie prenne le relais
          startupProbe:
            httpGet: {path: /healthz, port: {{ if $auth }}health{{ else }}http{{ end }}}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: {{ if $auth }}health{{ else }}http{{ end }}}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: {{ if $auth }}health{{ else }}http{{ end }}}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $auth }}
        {{- include "cl.authProxy" (dict "root" . "name" "auth-proxy" "port" 8080 "portName" "http" "local" $a.localAdmin.enabled "host" (include "cl.internalHost" .) "cookie" "_cl_auth" "secret" (include "cl.cookieSecretName" .) "tpl" "auth-templates" "base" "") | nindent 8 }}
        {{- if .Values.externalIngress.enabled }}
        {{- include "cl.authProxy" (dict "root" . "name" "auth-proxy-ext" "port" 8083 "portName" "http-ext" "local" false "host" .Values.externalIngress.host "cookie" (ternary "__Secure-cl_auth_ext" "__Host-_cl_auth_ext" (ne (.Values.externalIngress.pathPrefix | default "") "")) "secret" (include "cl.cookieSecretNameExt" .) "tpl" "auth-templates-ext" "base" (.Values.externalIngress.pathPrefix | default "")) | nindent 8 }}
        {{- end }}
        {{- end }}
      volumes:
        {{- if $auth }}
        - name: auth-templates
          configMap:
            name: {{ include "cl.fullname" . }}-auth-templates
        {{- if .Values.externalIngress.enabled }}
        - name: auth-templates-ext
          configMap:
            name: {{ include "cl.fullname" . }}-auth-templates-ext
        {{- end }}
        {{- if $a.localAdmin.enabled }}
        - name: auth-local
          secret:
            secretName: {{ include "cl.localAdminSecretName" . }}
            # 0444 : pas de fsGroup (comme les autres Secrets montés) — 0440 serait illisible par l'uid du pod
            defaultMode: 0444
            items:
              - key: htpasswd
                path: htpasswd
        {{- end }}
        {{- end }}
        - name: projets
          persistentVolumeClaim:
            claimName: {{ .Values.volume.existingClaim }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $legacy }}
        - name: secrets-legacy
          persistentVolumeClaim:
            claimName: {{ include "cl.fullname" . }}-secrets
            readOnly: true
        {{- end }}
        {{- if .Values.backends.docker.secretName }}
        - name: docker-tls
          secret:
            secretName: {{ .Values.backends.docker.secretName }}
            defaultMode: 0444
        {{- end }}
        {{- range .Values.backends.kubeconfigs }}
        - name: kube-{{ .name }}
          secret:
            secretName: {{ .secretName }}
            defaultMode: 0444
            items:
              - key: {{ .key }}
                path: config
        {{- end }}
