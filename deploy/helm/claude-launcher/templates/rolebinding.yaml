{{- $ctx := . -}}
{{- range $ns := prepend (.Values.rbac.extraNamespaces | default list) .Release.Namespace | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cl.fullname" $ctx }}
  namespace: {{ $ns }}
  labels:
    {{- include "cl.labels" $ctx | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cl.fullname" $ctx }}
    namespace: {{ $ctx.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cl.fullname" $ctx }}
{{- end }}
