{{- /* Compte local de secours admin@local (contracts/auth.md §8) : Secret <release>-local-admin généré à la première
installation (mot de passe de 32 caractères + ligne htpasswd bcrypt), conservé (lookup + keep) ; absent quand le compte est
désactivé ou qu'un Secret est fourni (auth.localAdmin.existingSecret). Le mot de passe n'est jamais dans les valeurs ni dans
NOTES.txt : lecture par kubectl get secret … -o jsonpath='{.data.password}'. */ -}}
{{- if and .Values.auth.enabled .Values.auth.localAdmin.enabled (not .Values.auth.localAdmin.existingSecret) }}
{{- $name := include "cl.localAdminSecretName" . }}
{{- $cur := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := randAlphaNum 32 }}
{{- if and $cur (index $cur.data "password") }}{{ $pw = index $cur.data "password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pw | b64enc }}
  {{- if and $cur (index $cur.data "htpasswd") (index $cur.data "password") }}
  htpasswd: {{ index $cur.data "htpasswd" }}
  {{- else }}
  htpasswd: {{ htpasswd "admin@local" $pw | b64enc }}
  {{- end }}
{{- end }}
