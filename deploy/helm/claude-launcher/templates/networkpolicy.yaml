{{- if .Values.networkPolicy.enabled }}
# Entrée du pod du launcher seulement depuis le namespace du contrôleur d'Ingress (réglable), sur le port du Service.
# Les sondes du kubelet viennent de l'hôte du nœud : admises par le CNI (Cilium : allow-localhost) ; avec un contrôleur en
# réseau d'hôte, donner les adresses des nœuds dans networkPolicy.ingressCIDRs. Sortie NON restreinte (backends distants,
# GitHub, ACME). Les NetworkPolicy du namespace s'additionnent (OU) : celles qui existent déjà ne sont pas modifiées.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cl.fullname" . }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cl.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
