{{- if and .Values.ingress.enabled .Values.ingress.tls.clusterIssuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cl.fullname" . }}
  labels:
    {{- include "cl.labels" . | nindent 4 }}
spec:
  secretName: {{ include "cl.tlsSecret" . }}
  dnsNames:
    - {{ .Values.ingress.host }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.ingress.tls.clusterIssuer }}
{{- end }}
