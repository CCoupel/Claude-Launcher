{{- $ctx := . -}}
{{- range $ns := prepend (.Values.rbac.extraNamespaces | default list) .Release.Namespace | uniq }}
---
# Droits du launcher, limités au namespace de la release : seulement les appels kubectl de core/k8s.go
# et core/close.go (apply, get, delete, wait, exec, scale, events). Aucun ClusterRole.
# ATTENTION : créer des StatefulSets et ouvrir un shell (pods/exec) dans n'importe quel pod du namespace
# équivaut à l'administrer : n'y mettre que le launcher et les pods de ses projets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cl.fullname" $ctx }}
  namespace: {{ $ns }}
  labels:
    {{- include "cl.labels" $ctx | nindent 4 }}
rules:
{{ include "cl.rules" $ctx | indent 0 }}
{{- end }}
