# Exécution du projet en conteneur (Claude-Launcher-NG2) — versionné avec le projet
image: docker.io/library/ubuntu:26.04
packages: [gh, golang-go, docker.io]   # docker.io : client des tests des groupes de serveurs (#61) ; paquets en plus (tmux, git, bash, sudo, curl : implicites) ; gh : issues, PR, releases
                            # golang-go : Go 1.22 d'Ubuntu, GOTOOLCHAIN=auto récupère la version de ng2/go.mod
# packages_by_manager: {}   # noms propres à une distribution, ex. { dnf: [libpq-devel] }
setup:                      # étapes exécutées une fois, en utilisateur, dans le projet
  # kubectl à la version du cluster (notée par .claude-launcher/k8s-acces-pod.sh), sinon la stable
  - |
    arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'); kv=/share/MFS/ROOT/CLAUDE_PROJETS/.kube/kubectl-version
    v=$(cat "$kv" 2>/dev/null || curl -fsSL https://dl.k8s.io/release/stable.txt)
    mkdir -p "$HOME/.local/bin"; curl -fsSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/$v/bin/linux/$arch/kubectl" && chmod +x "$HOME/.local/bin/kubectl"
  # accès au cluster : compte ng2-tests (namespace claude-ng2), créé par .claude-launcher/k8s-acces-pod.sh
  - mkdir -p "$HOME/.kube" && ln -sf /share/MFS/ROOT/CLAUDE_PROJETS/.kube/ng2-tests.kubeconfig "$HOME/.kube/config"
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
