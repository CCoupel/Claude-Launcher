# Exécution du projet en conteneur (Claude-Launcher-NG2) — versionné avec le projet
image: docker.io/library/ubuntu:26.04
packages: [gh, golang-go, docker.io, nodejs, buildah]   # docker.io : client des tests des groupes de serveurs (#61) ; paquets en plus (tmux, git, bash, sudo, curl : implicites) ; gh : issues, PR, releases
                            # nodejs : LTS de la distribution (Ubuntu 26.04 : 22.x, même nom apt/dnf/apk) — QA : `node --check ng2/ui/desktop/frontend/*.js` + petits scripts d'exécution du JS de l'interface native
                            # golang-go : Go 1.22 d'Ubuntu, GOTOOLCHAIN=auto récupère la version de ng2/go.mod
                            # buildah : image du launcher du cluster sans démon (v6.3.0, même nom apt/dnf/apk). Le conteneur n'a ni
                            # /dev/fuse ni CAP_SYS_ADMIN : stockage vfs obligatoire (STORAGE_DRIVER=vfs) ; sans root, Containerfile
                            # sans RUN (COPY seul) + `--storage-opt vfs.ignore_chown_errors=true --isolation chroot` ; avec RUN : sudo
packages_by_manager:        # noms propres à une distribution
  # cgo pour `go test -race` (QA) : gcc + en-têtes libc ; version de la distribution
  dnf: [gcc, glibc-devel]
  apk: [build-base]
  # apt (Ubuntu 26.04, noms t64) : bibliothèques + polices de chrome-headless-shell (capture PNG, étape setup ci-dessous)
  apt: [fonts-dejavu-core, fonts-liberation, fonts-noto-color-emoji, libasound2t64, libatk-bridge2.0-0t64, libatk1.0-0t64, libatspi2.0-0t64, libcairo2, libcups2t64, libdbus-1-3, libgbm1, libglib2.0-0t64, libnspr4, libnss3, libpango-1.0-0, libx11-6, libxcb1, libxcomposite1, libxdamage1, libxext6, libxfixes3, libxkbcommon0, libxrandr2, unzip,
        build-essential]    # build-essential : gcc + libc6-dev pour cgo (`CGO_ENABLED=1 go test -race`, QA)
setup:                      # étapes exécutées une fois, en utilisateur, dans le projet
  # kubectl à la version du cluster (notée par .claude-launcher/k8s-acces-pod.sh), sinon la stable
  - |
    arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'); kv=/share/MFS/ROOT/CLAUDE_PROJETS/.kube/kubectl-version
    v=$(cat "$kv" 2>/dev/null || curl -fsSL https://dl.k8s.io/release/stable.txt)
    mkdir -p "$HOME/.local/bin"; curl -fsSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/$v/bin/linux/$arch/kubectl" && chmod +x "$HOME/.local/bin/kubectl"
  # accès au cluster : compte ng2-tests (namespace claude-ng2), créé par .claude-launcher/k8s-acces-pod.sh
  - mkdir -p "$HOME/.kube" && ln -sf /share/MFS/ROOT/CLAUDE_PROJETS/.kube/ng2-tests.kubeconfig "$HOME/.kube/config"
  # helm (chart du launcher du cluster, v6.3.0 : lint/template en CI, install par deployer) : pas de paquet
  # officiel apt/dnf/apk → archive de get.helm.sh, somme vérifiée, sous ~/.local ; réinstallé seulement si absent
  # ou < 3.14
  - |
    b="$HOME/.local/bin/helm"
    cur=$("$b" version --template '{{.Version}}' 2>/dev/null || true)
    if [ -z "$cur" ] || [ "$(printf '%s\nv3.14.0\n' "$cur" | sort -V | head -1)" != "v3.14.0" ]; then
      v=$(curl -fsSL https://get.helm.sh/helm-latest-version); arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      t=$(mktemp -d -p "$HOME"); trap 'rm -rf "$t"' EXIT; f="helm-$v-linux-$arch.tar.gz"
      curl -fsSLo "$t/$f" "https://get.helm.sh/$f" && curl -fsSLo "$t/$f.sha256sum" "https://get.helm.sh/$f.sha256sum"
      (cd "$t" && sha256sum -c "$f.sha256sum") && tar -xzf "$t/$f" -C "$t"
      mkdir -p "$HOME/.local/bin" && install -m 755 "$t/linux-$arch/helm" "$b"
    fi
  # navigateur sans tête pour capture PNG (site, rendu QA) : chrome-headless-shell de Chrome for Testing (pas le
  # chromium-browser d'Ubuntu, transition snap) ; installé une fois, sous ~/.local ; usage :
  # chrome-headless-shell --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1000 --screenshot=<png> <url>
  - |
    d="$HOME/.local/opt/chrome-headless-shell"; b="$HOME/.local/bin/chrome-headless-shell"
    if ! "$b" --version >/dev/null 2>&1; then
      v=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)
      t=$(mktemp -d -p "$HOME"); trap 'rm -rf "$t"' EXIT
      curl -fsSLo "$t/chs.zip" "https://storage.googleapis.com/chrome-for-testing-public/$v/linux64/chrome-headless-shell-linux64.zip"
      rm -rf "$d" && mkdir -p "$d" "$HOME/.local/bin" && unzip -q "$t/chs.zip" -d "$d"
      ln -sf "$d/chrome-headless-shell-linux64/chrome-headless-shell" "$b"
    fi
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
