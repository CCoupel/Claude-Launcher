name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Routage par version majeure du tag :
#   < v4  → legacy : script bash claude-launcher.sh seul
#   = v4  → ng/    : Claude-Launcher-NG + script de redirection
#   ≥ v5  → ng2/   : Claude-Launcher-NG2, binaires seuls (v6 : + claude-launcher-ng2.exe)
# Rappel : GitHub exécute le workflow présent DANS le commit tagué ; ce routage
# s'applique donc aux tags posés sur un commit qui contient ce fichier.
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.r.outputs.target }}
    steps:
      - id: r
        run: |
          major=$(printf '%s' "$GITHUB_REF_NAME" | sed -nE 's/^v([0-9]+)\..*/\1/p')
          if [ -z "$major" ]; then echo "tag non reconnu : $GITHUB_REF_NAME" >&2; exit 1; fi
          if   [ "$major" -lt 4 ]; then t=legacy
          elif [ "$major" -eq 4 ]; then t=ng
          else t=ng2; fi
          echo "target=$t" >> "$GITHUB_OUTPUT"; echo "$GITHUB_REF_NAME → $t"

  # < v4 : legacy (script bash seul)
  release-legacy:
    needs: route
    if: ${{ needs.route.outputs.target == 'legacy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Patch SCRIPT_VERSION
        run: sed -i "s/^SCRIPT_VERSION=.*/SCRIPT_VERSION=\"${GITHUB_REF_NAME}\"/" claude-launcher.sh

      - name: Package
        run: |
          mkdir -p dist && cp claude-launcher.sh dist/
          cd dist && sha256sum claude-launcher.sh > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/claude-launcher.sh
            dist/SHA256SUMS
          generate_release_notes: true

  # v4 : launcher NG (dossier ng/) + script de redirection
  release:
    needs: route
    if: ${{ needs.route.outputs.target == 'ng' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Patch SCRIPT_VERSION
        run: sed -i "s/^SCRIPT_VERSION=.*/SCRIPT_VERSION=\"${GITHUB_REF_NAME}\"/" claude-launcher.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ng/go.mod

      - name: Test Claude-Launcher-NG
        working-directory: ng
        run: |
          go vet ./...
          go test ./...

      # Un binaire statique par plateforme ; la version du NG est celle du tag.
      - name: Build Claude-Launcher-NG
        working-directory: ng
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.ngVersion=${GITHUB_REF_NAME}" \
              -o ../dist/claude-launcher-ng-$os-$arch .
          done
          # le script (SCRIPT_VERSION déjà patché) est aussi vérifié par la mise à jour auto
          cp ../claude-launcher.sh ../dist/
          cd ../dist && sha256sum claude-launcher.sh claude-launcher-ng-* > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/claude-launcher.sh
            dist/claude-launcher-ng-*
            dist/SHA256SUMS
          generate_release_notes: true

  # ≥ v5 : launcher NG2 (dossier ng2/), binaires seuls (plus de claude-launcher.sh)
  release-ng2:
    needs: route
    if: ${{ needs.route.outputs.target == 'ng2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ng2/go.mod
          cache-dependency-path: ng2/go.sum

      # scripts/ci.sh contrôle le chart (helm)
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2

      # contrôles bloquants : la CI unique (scripts/ci.sh), comme en pré-validation ; l'image n'y est pas
      # construite (CL_CI_IMAGE=0, journalisé) : release-ng2-cluster construit et publie la vraie
      - name: CI Claude-Launcher-NG2
        env:
          CL_CI_IMAGE: "0"
        run: scripts/ci.sh

      - name: Build Claude-Launcher-NG2
        working-directory: ng2
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X claude-launcher-ng2/core.NgVersion=${GITHUB_REF_NAME}" \
              -o ../dist/claude-launcher-ng2-$os-$arch .
          done
          # Windows (#111, #112) : interface native Wails (WebView2), exécutable
          # graphique ; balises desktop,production exigées par Wails, sans cgo
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -trimpath \
            -ldflags "-s -w -H windowsgui -X claude-launcher-ng2/core.NgVersion=${GITHUB_REF_NAME}" \
            -o ../dist/claude-launcher-ng2.exe .
          cd ../dist && sha256sum claude-launcher-ng2-* claude-launcher-ng2.exe > SHA256SUMS

      # release en BROUILLON : publiée par publish-ng2 une fois l'image et le chart en place (jamais d'état partiel)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            dist/claude-launcher-ng2-*
            dist/claude-launcher-ng2.exe
            dist/SHA256SUMS
          generate_release_notes: true

      # binaires Linux pour l'image du launcher du cluster (même build, jamais recompilés : BORE)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ng2-linux
          path: dist/claude-launcher-ng2-linux-*
          retention-days: 1

  # ≥ v6.3 : image du launcher du cluster (ghcr) et chart Helm (OCI ghcr + archive jointe à la release).
  # Seul travail qui écrit dans les paquets (packages: write) ; la version vient du tag, jamais modifiée.
  release-ng2-cluster:
    needs: [route, release-ng2]
    if: ${{ needs.route.outputs.target == 'ng2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pièces jointes de la release (brouillon)
      packages: write   # ghcr.io/ccoupel/claude-launcher et ghcr.io/ccoupel/charts/claude-launcher
    env:
      IMAGE: ghcr.io/ccoupel/claude-launcher
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions épinglées par SHA complet (travail avec packages: write)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ng2-linux
          path: dist

      # le tag fait foi : Chart.yaml doit déjà porter la version (vérifié, jamais modifié)
      - name: Version du chart = tag
        run: |
          v=${GITHUB_REF_NAME#v}
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME : vX.Y.Z attendu" >&2; exit 1; }
          cv=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' deploy/helm/claude-launcher/Chart.yaml)
          av=$(sed -nE 's/^appVersion: *"?([^"]+)"?/\1/p' deploy/helm/claude-launcher/Chart.yaml)
          [ "$cv" = "$v" ] && [ "$av" = "$GITHUB_REF_NAME" ] || {
            echo "Chart.yaml : version=$cv appVersion=$av, attendu $v et $GITHUB_REF_NAME" >&2; exit 1; }
          chmod +x dist/claude-launcher-ng2-linux-*

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # relance : un tag d'image déjà publié n'est JAMAIS réécrit. Présent → réutilisé, à condition que son
      # empreinte soit celle notée dans la release (sinon échec : quelqu'un a poussé autre chose sous ce tag).
      - name: Tag d'image déjà publié ?
        id: existing
        run: |
          d=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          [ -n "$d" ] || { echo "$IMAGE:$GITHUB_REF_NAME absent : construction"; exit 0; }
          mkdir -p prev && gh release download "$GITHUB_REF_NAME" -p "claude-launcher-image-$GITHUB_REF_NAME.digest" -D prev 2>/dev/null || true
          rec=$(sed -nE 's/.*@(sha256:[0-9a-f]+).*/\1/p' "prev/claude-launcher-image-$GITHUB_REF_NAME.digest" 2>/dev/null || true)
          if [ -z "$rec" ]; then
            echo "ECHEC : $IMAGE:$GITHUB_REF_NAME existe déjà ($d) mais aucune empreinte n'est notée dans la release : tag non réécrit, vérifier à la main" >&2; exit 1
          fi
          [ "$rec" = "$d" ] || { echo "ECHEC : $IMAGE:$GITHUB_REF_NAME a l'empreinte $d, la release note $rec : tag non réécrit" >&2; exit 1; }
          echo "$IMAGE:$GITHUB_REF_NAME déjà publié ($d), conforme à la release : réutilisé sans reconstruction"

      - name: Image ghcr.io/ccoupel/claude-launcher
        id: image
        if: ${{ steps.existing.outputs.digest == '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          push: true
          provenance: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2

      # chart : une version déjà présente dans le registre OCI n'est pas repoussée
      - name: Chart (OCI ghcr) et empreinte
        env:
          DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir -p chart
          helm package deploy/helm/claude-launcher -d chart
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if helm show chart oci://ghcr.io/ccoupel/charts/claude-launcher --version "$v" >/dev/null 2>&1; then
            echo "chart $v déjà publié : non repoussé"
          else
            helm push "chart/claude-launcher-$v.tgz" oci://ghcr.io/ccoupel/charts
          fi
          printf '%s:%s@%s\n' "$IMAGE" "$GITHUB_REF_NAME" "$DIGEST" > "chart/claude-launcher-image-$GITHUB_REF_NAME.digest"
          cat "chart/claude-launcher-image-$GITHUB_REF_NAME.digest"
          (cd chart && sha256sum claude-launcher-*.tgz > SHA256SUMS-chart)
          gh release upload "$GITHUB_REF_NAME" chart/claude-launcher-*.tgz "chart/claude-launcher-image-$GITHUB_REF_NAME.digest" chart/SHA256SUMS-chart --clobber

  # publication de la release (brouillon jusque-là) quand binaires, image et chart sont tous en place
  publish-ng2:
    needs: [route, release-ng2, release-ng2-cluster]
    if: ${{ needs.route.outputs.target == 'ng2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publier la release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
