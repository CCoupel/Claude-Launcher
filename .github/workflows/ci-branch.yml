name: ci-branch

# Pré-validation sans publier (contrat C10 du template) : push d'une branche
# milestone/* ou lancement manuel. Son verdict conditionne la fermeture des
# issues DONE et la barrière du deployer avant fusion et tag.
on:
  push:
    branches: ['milestone/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ng2/go.mod
          cache-dependency-path: ng2/go.sum
      # Linux : scripts/ci.sh contrôle le chart (helm) et construit l'image (buildah, préinstallé)
      - if: runner.os == 'Linux'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - name: CI (scripts/ci.sh)
        run: scripts/ci.sh
