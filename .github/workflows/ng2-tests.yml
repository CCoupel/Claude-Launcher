name: ng2-tests

# Tests de Claude-Launcher-NG2 (ng2/) à chaque push et PR vers main et v6
# (v6 : branche de développement du launcher Windows, epic #114). La release
# (release.yml) refait les tests Linux avant de publier.
on:
  push:
    branches: [main, v6]
    paths: ['ng2/**', 'scripts/ci.sh', '.github/workflows/ng2-tests.yml']
  pull_request:
    branches: [main, v6]
    paths: ['ng2/**', 'scripts/ci.sh', '.github/workflows/ng2-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux : même script que la release et la pré-validation (scripts/ci.sh)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ng2/go.mod
          cache-dependency-path: ng2/go.sum
      # toutes les étapes sont dans scripts/ci.sh (CI unique, identique en local)
      - name: CI (vet, tests, compilation croisée de l'exe Windows)
        run: scripts/ci.sh

  # Windows (#112) : couches communes (core) et système (platform), interface
  # native (ui/desktop, Wails) ; la coque tmux (ui/tmux) n'y tourne pas, elle
  # est seulement compilée
  windows:
    runs-on: windows-latest
    # bash (Git for Windows) : « set -e », chaque commande en échec arrête
    # l'étape ; PowerShell ne regarderait que le code de sortie de la dernière
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ng2/go.mod
          cache-dependency-path: ng2/go.sum
      - name: CI (vet, build, tests, exe Windows)
        run: scripts/ci.sh
