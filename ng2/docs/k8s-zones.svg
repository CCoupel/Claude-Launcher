<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540" role="img" aria-label="Zones de confiance du launcher de cluster avec authentification (v7.0.0) : navigateur, Traefik, pod launcher avec sidecars oauth2-proxy, pods projets, racine partagée">
<style>
svg text{font-family:"Segoe UI",Inter,system-ui,sans-serif}
.z{fill:none;stroke-width:1.5;stroke-dasharray:6 4}
.z.lan{stroke:#d9822b;fill:#fff8f0}.z.clu{stroke:#2f6fed;fill:#f4f7ff}.z.ns{stroke:#2f6fed;fill:#eef3ff}
.z.pod{stroke:#1e8e4e;fill:#eefaf2}.z.core{stroke:#1e8e4e;fill:#dff4e7}.z.untr{stroke:#b8860b;fill:#fffbea}
.zl{font-size:12px;font-weight:600;fill:#4a5262}.zl.lan{fill:#a85d12}.zl.pod,.zl.core{fill:#17703d}.zl.untr{fill:#8a6508}.zl.clu,.zl.ns{fill:#2350b8}
.b{fill:#fff;stroke:#9aa3b2;stroke-width:1.2}.b.trust{stroke:#1e8e4e;stroke-width:2;fill:#f3fcf6}.b.untr{stroke:#b8860b;stroke-width:1.6;fill:#fffdf3}
.b.ext{stroke:#6b4fd8;fill:#f7f4ff}.b.opt{stroke-dasharray:5 3}
.bt{font-size:12.5px;font-weight:700;fill:#1d2330}.bl{font-size:11px;fill:#3d4554}
.a{fill:none;stroke:#2f3a4d;stroke-width:1.6}.a.oauth{stroke:#6b4fd8;stroke-dasharray:5 3}.a.mount{stroke:#b8860b;stroke-width:2}
.mk{fill:#2f3a4d}.mk.oauth{fill:#6b4fd8}.mk.mount{fill:#b8860b}
.al{font-size:11px;fill:#2f3a4d}.al.oauth{fill:#5a3fc0}.al.mount{fill:#8a6508}
.no{font-size:11px;fill:#c0392b;font-weight:600}
.lg{font-size:11px;fill:#3d4554}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ar-oauth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk oauth"/></marker>
<marker id="ar-mount" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mount"/></marker>
</defs>

<!-- Zone non fiable : poste et LAN -->
<rect class="z lan" x="10" y="30" width="1220" height="480" rx="10"/>
<text class="zl lan" x="20" y="48">Internet / LAN — non fiable</text>
<rect class="b" x="30" y="70" width="170" height="64" rx="6"/>
<text class="bt" x="38" y="87">Navigateur</text>
<text class="bl" x="38" y="103">connexion GitHub</text>
<text class="bl" x="38" y="117">cookie _cl_auth</text>
<rect class="b ext" x="30" y="380" width="170" height="60" rx="6"/>
<text class="bt" x="38" y="397">github.com</text>
<text class="bl" x="38" y="413">OAuth (sortie du pod)</text>

<!-- Zone cluster : contrôlée par l'administrateur -->
<rect class="z clu" x="220" y="50" width="1000" height="450" rx="10"/>
<text class="zl clu" x="230" y="68">Cluster — contrôlé par l'administrateur</text>
<rect class="b" x="240" y="80" width="170" height="150" rx="6"/>
<text class="bt" x="248" y="97">Traefik</text>
<text class="bl" x="248" y="113">ingress interne : LAN</text>
<text class="bl" x="248" y="127">ingress externe : option</text>
<text class="bl" x="248" y="141">TLS · rateLimit /oauth2/</text>
<text class="bl" x="248" y="155">HTTP → HTTPS</text>

<!-- Namespace du launcher, NetworkPolicy -->
<rect class="z ns" x="430" y="70" width="770" height="420" rx="10"/>
<text class="zl ns" x="440" y="88">Namespace du launcher — NetworkPolicy</text>
<rect class="z pod" x="450" y="100" width="450" height="236" rx="10"/>
<text class="zl pod" x="460" y="118">Pod launcher — zone de confiance</text>
<rect class="b trust" x="468" y="132" width="180" height="96" rx="6"/>
<text class="bt" x="476" y="149">auth-proxy :8080</text>
<text class="bl" x="476" y="165">seul port du Service</text>
<text class="bl" x="476" y="179">vérifie la session</text>
<text class="bl" x="476" y="193">pose X-Forwarded-User</text>
<text class="bl" x="476" y="207">admin@local : interne seul</text>
<rect class="b trust opt" x="468" y="240" width="180" height="60" rx="6"/>
<text class="bt" x="476" y="256">auth-proxy-ext :8083</text>
<text class="bl" x="476" y="272">ingress externe seul</text>
<text class="bl" x="476" y="286">sans compte local</text>

<!-- Boucle locale du pod -->
<rect class="z core" x="668" y="128" width="215" height="162" rx="10"/>
<text class="zl core" x="678" y="146">boucle locale du pod</text>
<rect class="b trust" x="680" y="152" width="192" height="110" rx="6"/>
<text class="bt" x="688" y="169">launcher :8081</text>
<text class="bl" x="688" y="185">lit l'identité du proxy</text>
<text class="bl" x="688" y="199">R1 : écritures admin</text>
<text class="bl" x="688" y="213">journal d'audit</text>
<text class="bl" x="688" y="227">santé :8082 ← kubelet</text>

<!-- Contenu non fiable : pods des projets -->
<rect class="z untr" x="915" y="100" width="270" height="200" rx="10"/>
<text class="zl untr" x="925" y="118">Contenu non fiable</text>
<rect class="b untr" x="930" y="132" width="240" height="80" rx="6"/>
<text class="bt" x="938" y="149">Pods des projets</text>
<text class="bl" x="938" y="165">PROJETS/…/&lt;projet&gt; + .claude</text>
<text class="bl" x="938" y="179">pas de jeton ServiceAccount</text>
<text class="bl" x="938" y="193">claude, git, outils du projet</text>
<text class="no" x="935" y="234">✕ coffre, backends.yaml, .kube</text>
<text class="no" x="935" y="252">✕ autres projets</text>

<!-- Stockage : racine partagée -->
<rect class="b" x="450" y="370" width="735" height="100" rx="6"/>
<text class="bt" x="458" y="387">Racine partagée MooseFS (PVC RWX)</text>
<text class="bl" x="458" y="403">PROJETS/ · .claude/  → pods des projets (subPath)</text>
<text class="bl" x="458" y="417">.config/claude-launcher-ng2/ (coffre, backends.yaml) · .cache/ (audit.jsonl) · .kube/</text>
<text class="bl" x="458" y="431">→ pod du launcher seulement</text>
<text class="bl" x="458" y="445">hub Linux et exe Windows : même racine, mode jeton</text>

<!-- Flux -->
<path class="a" d="M200,100 L240,120" marker-end="url(#ar)"/>
<text class="al" x="206" y="108">https</text>
<path class="a" d="M410,160 L468,170" marker-end="url(#ar)"/>
<text class="al" x="414" y="156">http</text>
<path class="a" d="M648,180 L680,190" marker-end="url(#ar)"/>
<path class="a" d="M410,200 L440,200 L440,270 L468,270" marker-end="url(#ar)"/>
<text class="al" x="444" y="236">externe</text>
<path class="a" d="M648,270 L740,270 L740,262" marker-end="url(#ar)"/>
<path class="a oauth" d="M468,218 L200,395" marker-end="url(#ar-oauth)"/>
<text class="al oauth" x="300" y="300">OAuth</text>
<path class="a mount" d="M1050,212 L1050,370" marker-end="url(#ar-mount)"/>
<path class="a mount" d="M776,290 L776,370" marker-end="url(#ar-mount)"/>
<text class="al mount" x="782" y="338">racine entière</text>

<!-- Légende -->
<g transform="translate(20,515)">
<path class="a" d="M0,6 L30,6" marker-end="url(#ar)"/><text class="lg" x="36" y="10">requête web</text>
<path class="a oauth" d="M130,6 L160,6" marker-end="url(#ar-oauth)"/><text class="lg" x="166" y="10">OAuth GitHub</text>
<path class="a mount" d="M270,6 L300,6" marker-end="url(#ar-mount)"/><text class="lg" x="306" y="10">montage (subPath)</text>
<text class="no" x="430" y="10">✕ refusé / absent</text>
</g>
</svg>
