<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="Zones de confiance : poste et LAN, cluster, hors cluster">
<style>
:root{--bg:#F6F7F9;--panel:#FFFFFF;--text:#1B1F27;--muted:#5B6372;--line:#C9CED6;--box:#FFFFFF;--k8s:#EAF1FF;--k8sl:#1F4FD1;--ns:#F3F6FC;--ext:#F4F1EA;--extl:#9A6B1F;--sec:#E9F7EF;--secl:#1E8E4E;--fut:#9AA1AC;--acc:#1F4FD1;--warn:#B5641C;--ui:"Segoe UI",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0B0D11;--panel:#12151B;--text:#E6E8EC;--muted:#8B93A1;--line:#323A46;--box:#171B22;--k8s:#0F1A30;--k8sl:#60A5FF;--ns:#121A28;--ext:#1D1912;--extl:#E0B060;--sec:#0F2219;--secl:#6EE7A8;--fut:#5B6372;--acc:#60CDFF;--warn:#F0A868}}
svg{font-family:var(--ui)}
svg .bx{fill:var(--box);stroke:var(--line);stroke-width:1.2}
svg .k8s{fill:var(--k8s);stroke:var(--k8sl);stroke-width:1.4}
svg .ns{fill:var(--ns);stroke:var(--k8sl);stroke-width:1;stroke-dasharray:5 3}
svg .ext{fill:var(--ext);stroke:var(--extl);stroke-width:1.2}
svg .sec{fill:var(--sec);stroke:var(--secl);stroke-width:1.4}
svg .fut{fill:none;stroke:var(--fut);stroke-width:1.4;stroke-dasharray:6 4}
svg .t{fill:var(--text);font-size:12px;font-weight:600}
svg .s{fill:var(--muted);font-size:10.5px}
svg .m{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
svg .f{fill:var(--fut);font-size:11px;font-style:italic}
svg .ok{fill:var(--secl);font-size:10.5px;font-weight:600}
svg .ln{stroke:var(--text);stroke-width:1.3;fill:none}
svg .lnd{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:4 3}
</style>
<rect x="0" y="0" width="1160" height="560" fill="var(--bg)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text)"/></marker></defs>
    <rect class="bx" x="10" y="10" width="230" height="540" rx="10"/><text class="t" x="24" y="34">Poste et LAN</text><text class="s" x="24" y="50">192.0.2.0/24</text>
    <rect class="bx" x="24" y="64" width="202" height="112" rx="8"/><text class="t" x="36" y="86">Navigateur</text><text class="s" x="36" y="104">interface web du cluster</text><text class="m" x="36" y="122">https://launcher.local</text><text class="m" x="36" y="140">/files/&lt;projet&gt;/…</text><text class="s" x="36" y="160">extension claude : maquettes</text>
    <rect class="k8s" x="24" y="190" width="202" height="122" rx="8"/><text class="t" x="36" y="212">Hub Linux</text><text class="s" x="36" y="230">coque tmux (terminal)</text><text class="s" x="36" y="246">interface web : mode jeton (option)</text><text class="m" x="36" y="264">maquettes 127.0.0.1:8765</text><text class="ok" x="36" y="284">même racine partagée</text><text class="s" x="36" y="300">backends : podman, ssh, k8s…</text>
    <rect class="k8s" x="24" y="326" width="202" height="122" rx="8"/><text class="t" x="36" y="348">Exe Windows</text><text class="s" x="36" y="366">fenêtre native (Wails)</text><text class="s" x="36" y="382">interface web : mode jeton (option)</text><text class="m" x="36" y="400">maquettes 127.0.0.1:8766</text><text class="s" x="36" y="414">(défaut Windows, réglable)</text><text class="ok" x="36" y="434">même racine partagée</text>
    <rect class="sec" x="24" y="462" width="202" height="76" rx="8"/><text class="t" x="36" y="482">En même temps</text><text class="s" x="36" y="500">un seul launcher pilote un</text><text class="s" x="36" y="514">projet à la fois (témoin de</text><text class="s" x="36" y="528">présence) ; prise de main</text>
    <rect class="k8s" x="270" y="10" width="610" height="540" rx="10"/><text class="t" x="284" y="34">Cluster RKE2</text>
    <rect class="ns" x="284" y="56" width="170" height="200" rx="8"/><text class="t" x="296" y="78">ns traefik</text><text class="s" x="296" y="98">Traefik (DaemonSet)</text><text class="m" x="296" y="116">LB &lt;IP du LB&gt;</text><text class="s" x="296" y="138">Ingress interne :</text><text class="s" x="296" y="154">ipAllowList LAN</text><text class="s" x="296" y="170">TLS CA interne</text><text class="s" x="296" y="186">(cert-manager)</text>
    <rect class="fut" x="296" y="200" width="146" height="46" rx="6"/><text class="f" x="304" y="218">Ingress externe</text><text class="f" x="304" y="236">v7.0.0 · refusé</text>
    <rect class="ns" x="480" y="56" width="386" height="330" rx="8"/><text class="t" x="492" y="78">ns du launcher (claude-ng2 / claude-qualif)</text>
    <rect class="sec" x="492" y="92" width="110" height="64" rx="7"/><text class="t" x="502" y="114">NetworkPolicy</text><text class="s" x="502" y="132">pods Traefik seuls</text><text class="m" x="502" y="148">port http</text>
    <rect class="k8s" x="620" y="92" width="234" height="150" rx="8"/><text class="t" x="632" y="114">Pod launcher</text><text class="s" x="632" y="132">StatefulSet · 1 réplique</text><text class="s" x="632" y="150">interface web (access: none)</text><text class="s" x="632" y="168">ServiceAccount + Role</text><text class="ok" x="632" y="192">arrêt ≤ 25 s (grâce 30 s)</text><text class="s" x="632" y="210">clients ssh · docker · podman</text><text class="s" x="632" y="228">kubectl</text>
    <rect class="bx" x="492" y="260" width="170" height="54" rx="7"/><text class="t" x="502" y="282">Racine partagée</text><text class="s" x="502" y="300">PVC RWX · CL_ROOT_BASE</text>
    <rect class="sec" x="676" y="260" width="178" height="54" rx="7"/><text class="t" x="686" y="282">Coffre (PVC RWO)</text><text class="s" x="686" y="300">un dossier par backend</text>
    <rect class="k8s" x="492" y="326" width="362" height="50" rx="7"/><text class="t" x="502" y="348">Pods des projets</text><text class="s" x="630" y="348">un StatefulSet par projet · même racine</text>
    <rect class="ns" x="480" y="402" width="386" height="96" rx="8"/><text class="t" x="492" y="424">ns supplémentaires (rbac.extraNamespaces)</text><text class="s" x="492" y="444">même Role, RoleBinding vers le ServiceAccount du launcher</text>
    <rect class="k8s" x="492" y="454" width="362" height="34" rx="6"/><text class="s" x="502" y="476">pods des projets d'un autre namespace</text>
    <rect class="ext" x="910" y="10" width="240" height="540" rx="10"/><text class="t" x="924" y="34">Hors cluster</text>
    <rect class="ext" x="924" y="56" width="212" height="90" rx="8"/><text class="t" x="936" y="78">Backends distants</text><text class="s" x="936" y="96">ssh · podman · docker</text><text class="m" x="936" y="114">&lt;IP du backend&gt; :22 / :2375</text><text class="s" x="936" y="132">clé + empreinte : coffre</text>
    <rect class="ext" x="924" y="166" width="212" height="70" rx="8"/><text class="t" x="936" y="188">Autre cluster</text><text class="s" x="936" y="206">kubeconfig du backend</text><text class="s" x="936" y="222">(coffre ou Secret monté)</text>
    <rect class="ext" x="924" y="256" width="212" height="56" rx="8"/><text class="t" x="936" y="278">GitHub</text><text class="s" x="936" y="296">vérification de version</text>
    <rect class="fut" x="924" y="332" width="212" height="70" rx="8"/><text class="f" x="936" y="354">Internet</text><text class="f" x="936" y="372">aucun accès en v6.4.0</text><text class="f" x="936" y="390">(externe : v7.0.0)</text>
    <path class="ln" d="M226 120 H280" marker-end="url(#ar)"/><text class="s" x="232" y="112">https</text>
    <path class="ln" d="M454 124 H488" marker-end="url(#ar)"/><path class="ln" d="M602 124 H616" marker-end="url(#ar)"/>
    <path class="ln" d="M780 242 V256" marker-end="url(#ar)"/><path class="ln" d="M640 242 V256" marker-end="url(#ar)"/>
    <path class="ln" d="M854 212 H864 V351 H858" marker-end="url(#ar)"/><path class="ln" d="M854 230 H874 V471 H858" marker-end="url(#ar)"/>
    <path class="ln" d="M854 110 H920" marker-end="url(#ar)"/><text class="s" x="862" y="104">ssh / tcp</text>
    <path class="ln" d="M854 150 C890 150 890 200 920 200" marker-end="url(#ar)"/>
    <path class="lnd" d="M854 225 C895 225 895 284 920 284" marker-end="url(#ar)"/>
        
  <path class="ln" d="M226 284 H466 V280 H488" marker-end="url(#ar)" style="stroke:var(--secl)"/>
    <path class="ln" d="M226 420 H470 V300 H488" marker-end="url(#ar)" style="stroke:var(--secl)"/>
    <text class="ok" x="300" y="278">même racine partagée (RWX)</text>
    <text class="s" x="290" y="446">prise de main : le témoin</text>
    <text class="s" x="290" y="460">de présence dit qui pilote</text>
  </svg>
